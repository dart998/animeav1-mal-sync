services:
  animeav1-mal-sync:
    image: ovelayos/animeav1-mal-sync:latest
    container_name: animeav1-mal-sync
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      MAL_CLIENT_ID: "cb55390f8b99e87e4ec8be9522f1d390"
      MAL_CLIENT_SECRET: "b0407ea058e2d892936e75dc81272cbdb0b61388afb31781537839746bad0f1d"
      MAL_REDIRECT_URI: "http://192.168.178.130:8787/oauth/callback"
      SYNC_INTERVAL_MINUTES: "15"
      DRY_RUN: "true"
      ONLY_INCREASE: "true"
      AUTO_SYNC: "false"
      TITLE_MATCH_THRESHOLD: "80"
      DATA_DIR: "/data"
      LISTEN_ADDR: ":8787"
    volumes:
      - animeav1-mal-data:/data
    security_opt:
      - seccomp=unconfined

volumes:
  animeav1-mal-data:
