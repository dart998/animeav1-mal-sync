name: Apply feature RC6 patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[RC6] apply feature patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mal-to-animeav1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch
        run: python3 tools/prepare_rc6.py
      - name: Format
        run: gofmt -w main.go reverse_sync.go reverse_conflicts.go reverse_runtime.go
      - name: Test
        run: go test ./...
      - name: Commit and push RC6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go Dockerfile VERSION docker-compose.portainer.yml
          git commit -m "RC6: add Docker healthcheck and move logs to /log"
          git push origin HEAD:feature/mal-to-animeav1
