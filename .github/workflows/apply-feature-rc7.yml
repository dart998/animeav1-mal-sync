name: Apply feature RC7 patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[RC7] apply feature patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mal-to-animeav1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply RC7 patch
        run: python3 tools/prepare_rc7.py
      - name: Format
        run: gofmt -w main.go reverse_sync.go reverse_runtime.go reverse_sync_rc7_test.go
      - name: Test
        run: go test ./...
      - name: Commit and push RC7
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go reverse_sync.go reverse_runtime.go reverse_sync_rc7_test.go VERSION docker-compose.portainer.yml
          git commit -m "RC7: fix reverse split mappings and AnimeAV1 unmatched UI"
          git push origin HEAD:feature/mal-to-animeav1
