name: Apply multiarch release update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[MULTIARCH] release 1.7.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update main to 1.7.0 multiarch
        run: |
          python3 tools/prepare_multiarch_release.py
          gofmt -w main.go
          go test ./...

      - name: Commit main release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/docker-publish.yml VERSION main.go docker-compose.portainer.yml
          git commit -m "Release 1.7.0 with ARMv7, ARM64 and AMD64 images"
          git push origin HEAD:main

      - name: Propagate multiarch build to feature branch
        shell: bash
        run: |
          git fetch origin feature/mal-to-animeav1
          git checkout -B feature/mal-to-animeav1 origin/feature/mal-to-animeav1
          python3 - <<'PY'
          from pathlib import Path

          wf = Path('.github/workflows/docker-publish.yml')
          s = wf.read_text(encoding='utf-8')
          s = s.replace('platforms: linux/arm/v7', 'platforms: linux/arm/v7,linux/arm64,linux/amd64')
          s = s.replace('Build and push ARMv7 image', 'Build and push multi-architecture image')
          wf.write_text(s, encoding='utf-8')

          Path('VERSION').write_text('1.8.0-rc1\n', encoding='utf-8')

          p = Path('main.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('appVersion = "1.7.0-rc7"', 'appVersion = "1.8.0-rc1"', 1)
          if 'appVersion = "1.8.0-rc1"' not in s:
              raise SystemExit('feature appVersion anchor not found')
          p.write_text(s, encoding='utf-8')

          p = Path('docker-compose.portainer.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ovelayos/animeav1-mal-sync:1.7.0-rc7', 'ovelayos/animeav1-mal-sync:1.8.0-rc1', 1)
          if 'ovelayos/animeav1-mal-sync:1.8.0-rc1' not in s:
              raise SystemExit('feature compose anchor not found')
          p.write_text(s, encoding='utf-8')
          PY
          gofmt -w main.go
          go test ./...
          git add .github/workflows/docker-publish.yml VERSION main.go docker-compose.portainer.yml
          git commit -m "Start 1.8.0 RC series with multiarch Docker builds"
          git push origin HEAD:feature/mal-to-animeav1
