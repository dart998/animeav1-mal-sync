name: Apply UI status update

on:
  push:
    branches:
      - ui-status-row-1-7-4
    paths:
      - .github/workflows/apply-ui-status-1-7-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply changes
        run: |
          python3 tools/apply_ui_1_7_4.py
          gofmt -w main.go
          go test ./...

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go VERSION
          git commit -m "UI: last sync time and compact actions"
          git push origin HEAD:ui-status-row-1-7-4
