name: Apply feature RC6 health fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == '[RC6] fix health JSON'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mal-to-animeav1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply fix
        run: python3 tools/fix_rc6_health.py
      - name: Format and test
        run: |
          gofmt -w main.go
          go test ./...
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go
          git commit -m "RC6: fix health JSON response"
          git push origin HEAD:feature/mal-to-animeav1
