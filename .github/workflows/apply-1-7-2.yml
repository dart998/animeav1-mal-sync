name: Apply 1.7.2 release

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[RELEASE] 1.7.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare 1.7.2
        run: |
          python3 tools/prepare_1_7_2.py
          gofmt -w main.go mal_config.go
          go test ./...

      - name: Commit 1.7.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go mal_config.go Dockerfile VERSION docker-compose.portainer.yml
          git commit -m "Release 1.7.2 with UI-managed MAL configuration"
          git push origin HEAD:main

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish 1.7.2 multiarch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: |
            ovelayos/animeav1-mal-sync:1.7.2
            ovelayos/animeav1-mal-sync:latest
