name: Apply 1.7.3 UI release

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[RELEASE] 1.7.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare 1.7.3
        run: |
          python3 tools/prepare_1_7_3.py
          gofmt -w main.go mal_config.go ui_panels.go
          go test ./...

      - name: Commit 1.7.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go mal_config.go ui_panels.go VERSION docker-compose.portainer.yml
          git commit -m "Release 1.7.3 with compact credential panels"
          git push origin HEAD:main
