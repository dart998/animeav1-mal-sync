name: Test and publish Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - docker-compose.yml
      - docker-compose.portainer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: |
            ovelayos/animeav1-mal-sync:${{ steps.version.outputs.value }}
            ovelayos/animeav1-mal-sync:latest

      - name: Update compose image tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          image = "ovelayos/animeav1-mal-sync"
          pattern = rf'(image:\s+\$\{{APP_IMAGE:-{re.escape(image)}:)[^}}]+(\}})'

          for filename in ("docker-compose.yml", "docker-compose.portainer.yml"):
              path = Path(filename)
              text = path.read_text()
              updated, count = re.subn(pattern, rf'\g<1>{version}\2', text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not locate APP_IMAGE in {filename}")
              path.write_text(updated)
          PY

          if git diff --quiet -- docker-compose.yml docker-compose.portainer.yml; then
            echo "Compose files already point to ${VERSION}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docker-compose.yml docker-compose.portainer.yml
            git commit -m "Deploy ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Redeploy Portainer stack
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${PORTAINER_WEBHOOK_URL}"
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --retry-delay 5 \
            "${PORTAINER_WEBHOOK_URL}"
