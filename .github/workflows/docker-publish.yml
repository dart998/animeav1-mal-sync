name: Test and publish Docker image

# RC pushes on feature/mal-to-animeav1 publish only the VERSION tag; stable main builds may also publish latest.
on:
  push:
    branches:
      - main
      - feature/mal-to-animeav1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        name: Resolve image tags
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "ovelayos/animeav1-mal-sync:$VERSION"
            if [ "$GITHUB_REF_NAME" = "main" ] && [[ "$VERSION" != *-* ]]; then
              echo "ovelayos/animeav1-mal-sync:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
