name: Apply direct AnimeAV1 links release

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[LINKFIX] release 1.7.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Patch stable branch
        run: |
          python3 tools/prepare_direct_animeav1_links.py main
          gofmt -w main.go
          go test ./...

      - name: Commit stable 1.7.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go VERSION docker-compose.portainer.yml
          git commit -m "Release 1.7.1 with session-safe AnimeAV1 links"
          git push origin HEAD:main

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish stable multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: |
            ovelayos/animeav1-mal-sync:1.7.1
            ovelayos/animeav1-mal-sync:latest

      - name: Patch feature branch
        shell: bash
        run: |
          git fetch origin feature/mal-to-animeav1
          git checkout -B feature/mal-to-animeav1 origin/feature/mal-to-animeav1
          git show origin/main:tools/prepare_direct_animeav1_links.py > tools/prepare_direct_animeav1_links.py
          python3 tools/prepare_direct_animeav1_links.py feature
          gofmt -w main.go
          go test ./...
          git add main.go VERSION docker-compose.portainer.yml tools/prepare_direct_animeav1_links.py
          git commit -m "RC2: use session-safe direct AnimeAV1 links"
          git push origin HEAD:feature/mal-to-animeav1

      - name: Build and publish feature RC2 multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: ovelayos/animeav1-mal-sync:1.8.0-rc2
