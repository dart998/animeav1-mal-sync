name: Integrate reverse sync RC

on:
  push:
    branches: [feature/mal-to-animeav1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mal-to-animeav1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply integration
        run: python3 tools/integrate_reverse_rc.py
      - name: Format
        run: gofmt -w main.go reverse_sync.go reverse_conflicts.go reverse_runtime.go
      - name: Test
        run: go test ./...
      - name: Commit integrated RC
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes pending"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go reverse_sync.go reverse_conflicts.go reverse_runtime.go VERSION docker-compose.portainer.yml
          git commit -m "Integrate MAL to AnimeAV1 reverse sync RC1"
          git push origin HEAD:feature/mal-to-animeav1
